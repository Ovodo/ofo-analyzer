[project]
name = "ofo-analyzer"
version = "0.1.0"
description = "Open Frequency Observatory (OFO) — local-first acoustic signal acquisition and analysis prototype"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "OVD" }]
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "sounddevice>=0.5",
  "soundfile>=0.12",
]

[project.optional-dependencies]
ui = [
  "PySide6>=6.7",
  "pyqtgraph>=0.13",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
ofo-analyzer = "ofo_analyzer.ui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ofo_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  # sounddevice 0.5.6 internally sets `data.shape = -1, channels` in its
  # PortAudio callback machinery, deprecated in NumPy 2.5. Upstream issue,
  # harmless to data integrity; remove this filter when sounddevice fixes it.
  "ignore:Setting the shape on a NumPy array:DeprecationWarning",
]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
